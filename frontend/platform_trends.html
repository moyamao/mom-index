<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>平台情绪变化</title>
<style>
body{background:#0f172a;color:#e2e8f0;font-family:sans-serif;margin:24px}a{color:#38bdf8}select{background:#1e293b;color:inherit;padding:10px;margin:8px;border:1px solid #475569}table{border-collapse:collapse;width:100%;background:#1e293b}td,th{text-align:left;padding:12px;border-bottom:1px solid #334155}main{max-width:1200px;margin:auto}.scroll{overflow:auto}p{color:#94a3b8}
</style><main><a href="dashboard.html">返回看板</a><h1>平台情绪变化</h1>
<p>北京时间；按帖子发布时间汇总。负分偏恐惧，正分偏贪婪，0 为中性。样本量少时请谨慎解读。</p>
<select id="profile"></select><select id="sector"></select><select id="period"><option value="daily">每日</option><option value="hourly">每小时</option><option value="weekly">每周</option></select>
<p id="status"></p><div class="scroll"><table><thead><tr><th>时间</th><th>平台</th><th>样本</th><th>情绪指数（-100~+100）</th><th>变化（点）</th><th>买入/卖出帖</th></tr></thead><tbody id="rows"></tbody></table></div></main>
<script>
const names={nasdaq:'纳斯达克',gold:'黄金',cpo:'CPO',semiconductor:'半导体',storage:'存储',guba:'股吧',xiaohongshu:'小红书',weibo:'微博',xueqiu:'雪球',wechat:'微信'};
let series=[];
function render(){const rows=series.filter(x=>(x.analysis_profile||'legacy')===profile.value&&x.sector===sector.value&&x.period===period.value).flatMap(x=>x.records.map(r=>({...r,platform:x.platform}))).sort((a,b)=>b.date.localeCompare(a.date));
document.getElementById('rows').replaceChildren(...rows.map(r=>{const tr=document.createElement('tr');[r.date,names[r.platform]||r.platform,r.post_count,r.sentiment_mean,r.change===null?'无连续对照':r.change,`${r.buy_count}/${r.sell_count}`].forEach(v=>{const td=document.createElement('td');td.textContent=v;tr.append(td)});return tr}));}
const profile=document.getElementById('profile'),sector=document.getElementById('sector'),period=document.getElementById('period');
fetch('/api/dashboard-data',{cache:'no-store'}).then(async r=>{const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||`看板 API 请求失败 (${r.status})`);return d}).then(d=>{(d.sector_catalog||[]).forEach(x=>names[x.code]=x.name);const t=d.platform_sentiment_trends||{};series=t.series||[];document.getElementById('status').textContent=t.note||'请运行新版本任务生成平台情绪历史';[...new Set(series.map(x=>x.analysis_profile||'legacy'))].forEach(s=>profile.add(new Option(s,s)));profile.value=[...profile.options].map(x=>x.value).includes('macbook-27b')?'macbook-27b':profile.options[0]?.value;[...new Set(series.map(x=>x.sector))].forEach(s=>sector.add(new Option(names[s]||s,s)));render()}).catch(e=>document.getElementById('status').textContent=`数据加载失败：${e.message}`);profile.onchange=sector.onchange=period.onchange=render;
</script></html>
