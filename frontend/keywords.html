<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>关键词管理</title><style>
body{background:#0f172a;color:#e2e8f0;font-family:sans-serif;margin:24px}main{max-width:900px;margin:auto}a{color:#38bdf8}input,select,button{background:#1e293b;color:inherit;border:1px solid #475569;border-radius:8px;padding:10px;margin:5px}table{width:100%;border-collapse:collapse;background:#1e293b;margin-top:16px}td,th{padding:10px;border-bottom:1px solid #334155;text-align:left}.off{opacity:.45}p{color:#94a3b8}
</style><main><a href="dashboard.html">返回看板</a><h1>监控关键词</h1><p>关键词保存在 Mac mini MySQL。修改会记录审计日志，下次采集生效。</p>
<select id="sector"><option>nasdaq</option><option>gold</option><option>cpo</option><option>semiconductor</option><option>storage</option></select><input id="keyword" placeholder="新增关键词"><input id="token" type="password" placeholder="管理 token"><button id="add">新增并启用</button><p id="status"></p>
<table><thead><tr><th>板块</th><th>关键词</th><th>状态</th><th>更新时间</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></main><script>
const status=document.getElementById('status'),rows=document.getElementById('rows');
async function readJson(r){const type=r.headers.get('content-type')||'';if(!type.includes('application/json'))throw Error('管理 API 未启动，请使用 scripts/web_server.py 提供网页服务');return r.json()}
async function save(sector,keyword,enabled){const r=await fetch('/api/keywords',{method:'POST',headers:{'Content-Type':'application/json','X-Admin-Token':document.getElementById('token').value},body:JSON.stringify({sector,keyword,enabled})});const d=await readJson(r);if(!r.ok)throw Error(d.error||r.status);await load()}
async function load(){const r=await fetch('/api/keywords',{cache:'no-store'}),d=await readJson(r);rows.replaceChildren(...(d.items||[]).map(item=>{const tr=document.createElement('tr');if(!item.enabled)tr.className='off';[item.sector,item.keyword,item.enabled?'启用':'停用',item.updated_at].forEach(v=>{const td=document.createElement('td');td.textContent=v;tr.append(td)});const td=document.createElement('td'),button=document.createElement('button');button.textContent=item.enabled?'停用':'启用';button.onclick=()=>save(item.sector,item.keyword,!item.enabled).catch(e=>status.textContent=e.message);td.append(button);tr.append(td);return tr}))}
document.getElementById('add').onclick=()=>save(document.getElementById('sector').value,document.getElementById('keyword').value,true).catch(e=>status.textContent=e.message);load().catch(e=>status.textContent=e.message);
</script></html>
