<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>市场情绪监控 · 帖子明细</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: #0f172a;
  color: #e2e8f0;
}
.header {
  background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
  border-bottom: 1px solid #334155;
  padding: 20px 24px;
}
.header h1 {
  font-size: 28px;
  margin-bottom: 4px;
  color: #f8fafc;
}
.subtitle {
  color: #94a3b8;
  font-size: 14px;
}
.header-links {
  margin-top: 14px;
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}
.jump-link {
  color: #cbd5e1;
  text-decoration: none;
  background: rgba(148,163,184,0.12);
  border: 1px solid #334155;
  border-radius: 999px;
  padding: 8px 14px;
  font-size: 13px;
}
.container {
  max-width: 1280px;
  margin: 0 auto;
  padding: 24px 16px 40px;
}
.filters, .summary {
  background: #1e293b;
  border: 1px solid #334155;
  border-radius: 14px;
  padding: 16px;
  margin-bottom: 18px;
}
.filters-grid {
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  gap: 12px;
}
.filter-item label {
  display: block;
  color: #94a3b8;
  font-size: 12px;
  margin-bottom: 6px;
}
.filter-item select, .filter-item input {
  width: 100%;
  background: #0f172a;
  color: #e2e8f0;
  border: 1px solid #334155;
  border-radius: 10px;
  padding: 10px 12px;
  font-size: 14px;
}
.summary-row {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}
.summary-chip {
  border-radius: 999px;
  padding: 8px 12px;
  font-size: 13px;
  color: #cbd5e1;
  border: 1px solid #334155;
  background: rgba(148,163,184,0.08);
}
.posts {
  display: grid;
  gap: 14px;
}
.post-card {
  background: #1e293b;
  border: 1px solid #334155;
  border-radius: 14px;
  padding: 18px;
}
.post-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
}
.post-title {
  color: #f8fafc;
  text-decoration: none;
  font-size: 18px;
  font-weight: 700;
  line-height: 1.45;
}
.post-title:hover { color: #7dd3fc; }
.badges {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 10px;
}
.badge {
  border-radius: 999px;
  padding: 5px 10px;
  font-size: 12px;
  border: 1px solid #334155;
}
.badge.platform { background: rgba(59,130,246,0.16); color: #bfdbfe; }
.badge.sector { background: rgba(148,163,184,0.12); color: #cbd5e1; }
.badge.level { background: rgba(34,197,94,0.16); color: #86efac; }
.badge.intent-buy { background: rgba(34,197,94,0.14); color: #4ade80; }
.badge.intent-sell { background: rgba(239,68,68,0.14); color: #f87171; }
.badge.intent-neutral { background: rgba(148,163,184,0.14); color: #cbd5e1; }
.score-box {
  min-width: 150px;
  text-align: right;
}
.score-main {
  font-size: 30px;
  font-weight: 800;
  color: #f8fafc;
}
.score-sub {
  color: #94a3b8;
  font-size: 12px;
}
.meta-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 10px;
  margin-top: 14px;
}
.excerpt-note {
  margin-top: 14px;
  border-left: 3px solid #38bdf8;
  background: rgba(56, 189, 248, 0.08);
  color: #bae6fd;
  padding: 10px 12px;
  border-radius: 10px;
  font-size: 13px;
  line-height: 1.6;
}
.meta-item {
  background: rgba(15,23,42,0.42);
  border: 1px solid #334155;
  border-radius: 10px;
  padding: 10px;
}
.meta-label {
  color: #64748b;
  font-size: 11px;
  margin-bottom: 4px;
}
.meta-value {
  color: #e2e8f0;
  font-size: 13px;
  word-break: break-word;
}
.content {
  margin-top: 14px;
  color: #cbd5e1;
  line-height: 1.7;
  font-size: 14px;
  white-space: pre-wrap;
}
.content-box {
  margin-top: 14px;
  background: rgba(15,23,42,0.28);
  border: 1px solid #334155;
  border-radius: 12px;
  padding: 14px;
}
.content-preview {
  color: #e2e8f0;
  line-height: 1.8;
  font-size: 15px;
  white-space: pre-wrap;
}
.content-actions {
  margin-top: 10px;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.link-button {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: #bae6fd;
  text-decoration: none;
  border: 1px solid #334155;
  background: rgba(56,189,248,0.08);
  border-radius: 999px;
  padding: 7px 12px;
  font-size: 13px;
}
.fold {
  margin-top: 12px;
  border: 1px solid #334155;
  border-radius: 10px;
  background: rgba(15,23,42,0.26);
  overflow: hidden;
}
.fold summary {
  cursor: pointer;
  list-style: none;
  padding: 12px 14px;
  color: #cbd5e1;
  font-size: 13px;
  user-select: none;
}
.fold summary::-webkit-details-marker {
  display: none;
}
.fold-body {
  padding: 0 14px 14px;
}
.section-title {
  margin-top: 14px;
  margin-bottom: 8px;
  color: #94a3b8;
  font-size: 12px;
}
.signal-list {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.signal-chip {
  border-radius: 999px;
  padding: 6px 10px;
  font-size: 12px;
  color: #cbd5e1;
  background: rgba(148,163,184,0.08);
  border: 1px solid #334155;
}
.reasoning {
  margin-top: 10px;
  background: rgba(15,23,42,0.35);
  border: 1px solid #334155;
  border-radius: 10px;
  padding: 12px;
  color: #cbd5e1;
  line-height: 1.7;
  font-size: 14px;
}
.model-results {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-top: 14px;
}
.model-result {
  background: rgba(15,23,42,0.48);
  border: 1px solid #334155;
  border-left: 3px solid #38bdf8;
  border-radius: 9px;
  padding: 9px 11px;
}
.model-result.fallback { border-left-color: #f59e0b; }
.model-result-line { display:flex;align-items:center;gap:8px;flex-wrap:wrap; }
.model-result-name { min-width:100px;font-size:13px;font-weight:750;color:#f8fafc; }
.model-result-engine { color:#64748b;font-size:11px; }
.model-value { color:#cbd5e1;font-size:12px;white-space:nowrap; }
.model-value strong { color:#f8fafc; }
.model-reasoning-fold { margin-top:5px;color:#64748b;font-size:11px; }
.model-reasoning-fold summary { cursor:pointer;display:inline;color:#94a3b8; }
.model-reasoning-fold div { padding-top:5px;line-height:1.55;color:#94a3b8; }
.empty, .loading {
  text-align: center;
  color: #94a3b8;
  padding: 36px 12px;
}
@media (max-width: 960px) {
  .filters-grid, .meta-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .post-head {
    flex-direction: column;
  }
  .score-box {
    text-align: left;
  }
}
@media (max-width: 640px) {
  .filters-grid, .meta-grid {
    grid-template-columns: 1fr;
  }
}
</style>
</head>
<body>
<div class="header">
  <h1>帖子明细</h1>
  <div class="subtitle">同一帖子并列查看 14B / 27B 的情绪、仓位、预期与判定理由</div>
  <div class="header-links">
    <a class="jump-link" href="dashboard.html">返回总览</a>
  </div>
</div>

<div class="container">
  <div class="summary" id="summary">
    <div class="loading">加载中...</div>
  </div>

  <div class="filters">
    <div class="filters-grid">
      <div class="filter-item">
        <label>平台</label>
        <select id="platform-filter"></select>
      </div>
      <div class="filter-item">
        <label>板块</label>
        <select id="sector-filter"></select>
      </div>
      <div class="filter-item">
        <label>内容类型</label>
        <select id="level-filter"></select>
      </div>
      <div class="filter-item">
        <label>意图</label>
        <select id="intent-filter"></select>
      </div>
      <div class="filter-item">
        <label>模型覆盖</label>
        <select id="model-filter"></select>
      </div>
      <div class="filter-item">
        <label>搜索</label>
        <input id="search-input" type="text" placeholder="标题 / 内容 / 作者 / 关键词">
      </div>
    </div>
  </div>

  <div class="posts" id="posts">
    <div class="loading">加载中...</div>
  </div>
</div>

<script>
const PLATFORM_NAMES = {
  guba: '股吧',
  weibo: '微博',
  xiaohongshu: '小红书',
  xueqiu: '雪球',
  unknown: '其他',
};

const SECTOR_NAMES = {
  nasdaq: '纳斯达克',
  gold: '黄金',
  cpo: 'CPO通信',
  semiconductor: '半导体',
  storage: '存储',
};

const CONTENT_TYPES = ['opinion', 'news', 'spam'];
const INTENT_NAMES = {
  all: '全部',
  buy: '买入',
  sell: '卖出',
  neutral: '观望',
};

let allItems = [];
let modelProfiles = [];

function el(id) {
  return document.getElementById(id);
}

function fmtSentiment(score) {
  const n = Number(score || 0);
  if (n >= 0.5) return `贪婪 ${n}`;
  if (n <= -0.5) return `恐惧 ${n}`;
  return `中性 ${n}`;
}

function intentBadge(intent) {
  if (intent === 'buy') return 'intent-buy';
  if (intent === 'sell') return 'intent-sell';
  return 'intent-neutral';
}

function escapeHtml(value) {
  return String(value || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function normalizeCompact(text) {
  return String(text || '').replace(/\s+/g, '').trim();
}

function isContentRedundant(item) {
  const title = normalizeCompact(item.title);
  const content = normalizeCompact(item.content);
  if (!content) return true;
  if (content === title) return true;
  if (title && content.startsWith(title)) return true;
  return false;
}

function renderContent(item) {
  const content = String(item.content || '').trim();
  const redundant = isContentRedundant(item);
  const preview = content || item.title || '未抓到正文';
  const noteHtml = item.content_note ? `<div class="excerpt-note">${escapeHtml(item.content_note)}</div>` : '';
  const contentMeta = item.content_length ? `正文长度 ${item.content_length}` : '未抓到正文';
  const linkHtml = item.url ? `<a class="link-button" href="${item.url}" target="_blank" rel="noopener noreferrer">查看原帖全文</a>` : '';

  if (redundant) {
    return `
      ${noteHtml}
      <div class="content-box">
        <div class="content-preview">${escapeHtml(preview)}</div>
        <div class="content-actions">
          <span class="summary-chip">${escapeHtml(contentMeta)}</span>
          ${linkHtml}
        </div>
      </div>
    `;
  }

  return `
    ${noteHtml}
    <div class="content-box">
      <div class="content-preview">${escapeHtml(preview)}</div>
      <div class="content-actions">
        <span class="summary-chip">${escapeHtml(contentMeta)}</span>
        ${linkHtml}
      </div>
    </div>
  `;
}

function buildSelectOptions(select, values, allLabel = '全部') {
  select.innerHTML = [`<option value="all">${allLabel}</option>`]
    .concat(values.map(value => `<option value="${value}">${value}</option>`))
    .join('');
}

function renderSummary(items) {
  const counts = items.reduce((acc, item) => {
    acc[item.platform] = (acc[item.platform] || 0) + 1;
    return acc;
  }, {});
  const shared = items.filter(item => item.model_count >= modelProfiles.length && modelProfiles.length > 1).length;
  const chips = [
    `<span class="summary-chip">总帖子 ${items.length}</span>`,
    `<span class="summary-chip">共同成功判定 ${shared}</span>`,
    `<span class="summary-chip">模型 ${modelProfiles.join(' / ') || '暂无'}</span>`,
    ...Object.entries(counts || {}).sort((a, b) => b[1] - a[1]).map(
      ([platform, count]) => `<span class="summary-chip">${PLATFORM_NAMES[platform] || platform} ${count}</span>`
    )
  ];
  el('summary').innerHTML = `<div class="summary-row">${chips.join('')}</div>`;
}

function currentFilters() {
  return {
    platform: el('platform-filter').value,
    sector: el('sector-filter').value,
    contentType: el('level-filter').value,
    intent: el('intent-filter').value,
    model: el('model-filter').value,
    q: el('search-input').value.trim().toLowerCase(),
  };
}

function filterItems(items) {
  const f = currentFilters();
  return items.filter(item => {
    if (f.platform !== 'all' && item.platform !== f.platform) return false;
    if (f.sector !== 'all' && item.sector !== f.sector) return false;
    const analyses = item.analyses || [];
    if (f.contentType !== 'all' && !analyses.some(a => a.content_type === f.contentType)) return false;
    if (f.intent !== 'all' && !analyses.some(a => a.intent === f.intent)) return false;
    if (f.model === 'both' && item.model_count < modelProfiles.length) return false;
    if (f.model !== 'all' && f.model !== 'both' && !analyses.some(a => a.profile === f.model && a.analysis_engine === 'llm')) return false;
    if (f.q) {
      const hay = [
        item.title, item.content, item.author, item.keyword,
        ...analyses.flatMap(a => [a.profile, a.model_name, a.reasoning]),
      ].join(' ').toLowerCase();
      if (!hay.includes(f.q)) return false;
    }
    return true;
  });
}

const POSITION_NAMES = {holding:'持有', trapped:'被套', none:'空仓', unknown:'未知'};
const OUTLOOK_NAMES = {bullish:'看涨', bearish:'看跌', sideways:'震荡', unknown:'未知'};

function renderAnalysis(analysis) {
  const isLlm = analysis.analysis_engine === 'llm';
  const isNews = analysis.content_type === 'news';
  const score = Math.round(Number(analysis.sentiment_score || 0) * 100);
  return `
    <section class="model-result ${isLlm ? '' : 'fallback'}">
      <div class="model-result-line">
        <span class="model-result-name">${escapeHtml(analysis.profile)}</span>
        <span class="badge ${isLlm ? 'level' : 'intent-neutral'}">${isLlm ? 'LLM' : '规则回退'}</span>
        <span class="model-value">类别 <strong>${isNews ? '资讯' : analysis.content_type === 'spam' ? '无效' : '观点'}</strong></span>
        <span class="model-value">情绪 <strong>${isNews ? '不参与' : `${score >= 0 ? '+' : ''}${score}`}</strong></span>
        <span class="model-value">意图 <strong>${escapeHtml(INTENT_NAMES[analysis.intent] || '观望')}</strong></span>
        <span class="model-value">仓位 <strong>${escapeHtml(POSITION_NAMES[analysis.position_status] || '未知')}</strong></span>
        <span class="model-value">预期 <strong>${escapeHtml(OUTLOOK_NAMES[analysis.market_outlook] || '未知')}</strong></span>
        <span class="model-result-engine">置信度 ${Number(analysis.sentiment_confidence || 0).toFixed(2)}</span>
      </div>
      ${analysis.reasoning ? `<details class="model-reasoning-fold"><summary>查看判定理由</summary><div>${escapeHtml(analysis.reasoning)}</div></details>` : ''}
    </section>`;
}

function renderPosts(items) {
  const container = el('posts');
  if (!items.length) {
    container.innerHTML = '<div class="empty">当前筛选条件下没有帖子</div>';
    return;
  }

  container.innerHTML = items.map(item => {
    const analyses = item.analyses || [];
    const typeLabels = [...new Set(analyses.map(a => a.content_type === 'news' ? '资讯' : a.content_type === 'spam' ? '无效' : '个人观点'))];
    const intentLabels = [...new Set(analyses.filter(a => a.content_type !== 'news').map(a => INTENT_NAMES[a.intent] || '观望'))];
    return `
    <article class="post-card">
      <div class="post-head">
        <div style="min-width:0;">
          <a class="post-title" href="${item.url || '#'}" target="_blank" rel="noopener noreferrer">${escapeHtml(item.title || '无标题')}</a>
          <div class="badges">
            <span class="badge platform">${escapeHtml(PLATFORM_NAMES[item.platform] || item.platform)}</span>
            <span class="badge sector">${escapeHtml(SECTOR_NAMES[item.sector] || item.sector)}</span>
            <span class="badge level">${escapeHtml(typeLabels.join(' / ') || '未分类')}</span>
            ${intentLabels.length ? `<span class="badge intent-neutral">${escapeHtml(intentLabels.join(' / '))}</span>` : ''}
            ${item.keyword ? `<span class="badge sector">关键词: ${escapeHtml(item.keyword)}</span>` : ''}
          </div>
        </div>
        <div class="score-box">
          <div class="score-main">${item.model_count}/${modelProfiles.length}</div>
          <div class="score-sub">模型成功判定</div>
        </div>
      </div>

      <div class="meta-grid">
        <div class="meta-item">
          <div class="meta-label">作者</div>
          <div class="meta-value">${escapeHtml(item.author || '未知')}</div>
        </div>
        <div class="meta-item">
          <div class="meta-label">发布时间</div>
          <div class="meta-value">${escapeHtml(item.source_datetime || item.published_at || item.date || '未知')}</div>
        </div>
        <div class="meta-item"><div class="meta-label">帖子 ID</div><div class="meta-value">${escapeHtml(item.post_id || '未知')}</div></div>
        <div class="meta-item"><div class="meta-label">判定覆盖</div><div class="meta-value">${(item.analyses || []).map(a => `${escapeHtml(a.profile)}(${a.analysis_engine === 'llm' ? 'LLM' : '回退'})`).join(' / ')}</div></div>
      </div>

      ${renderContent(item)}

      <div class="section-title">模型判定对照 · 情绪范围 -100 至 +100</div>
      <div class="model-results">${(item.analyses || []).map(renderAnalysis).join('')}</div>
    </article>
  `}).join('');
}

function rerender() {
  renderPosts(filterItems(allItems));
}

fetch('/api/post-model-comparison', {cache: 'no-store'})
  .then(resp => resp.json())
  .then(data => {
    if (data.error) throw new Error(data.error);
    allItems = data.items || [];
    modelProfiles = data.profiles || [];
    renderSummary(allItems);
    el('summary').insertAdjacentHTML('afterbegin', `<div class="subtitle" style="margin-bottom:12px">当前对照日期：北京时间 ${escapeHtml(data.comparison_date || '未知')}。仅展示当天发布的帖子。</div>`);

    const platformCounts = allItems.reduce((acc, item) => {
      acc[item.platform] = (acc[item.platform] || 0) + 1;
      return acc;
    }, {});

    buildSelectOptions(el('platform-filter'), Object.keys(platformCounts).map(
      key => key
    ).sort((a, b) => (platformCounts[b] || 0) - (platformCounts[a] || 0)), '全部平台');
    buildSelectOptions(el('sector-filter'), Object.keys(SECTOR_NAMES), '全部板块');
    el('level-filter').innerHTML = '<option value="all">全部类型</option><option value="opinion">个人观点</option><option value="news">资讯</option><option value="spam">无效</option>';
    el('intent-filter').innerHTML = Object.entries(INTENT_NAMES).map(
      ([value, label]) => `<option value="${value}">${label}</option>`
    ).join('');
    el('model-filter').innerHTML = '<option value="all">全部帖子</option>'
      + (modelProfiles.length > 1 ? '<option value="both">两个模型均成功</option>' : '')
      + modelProfiles.map(profile => `<option value="${escapeHtml(profile)}">${escapeHtml(profile)} 成功</option>`).join('');

    ['platform-filter', 'sector-filter', 'level-filter', 'intent-filter', 'model-filter'].forEach(id => {
      el(id).addEventListener('change', rerender);
    });
    el('search-input').addEventListener('input', rerender);

    rerender();
  })
  .catch(err => {
    el('summary').innerHTML = `<div class="empty">模型帖子接口加载失败: ${escapeHtml(err.message)}</div>`;
    el('posts').innerHTML = '<div class="empty">请确认 web_server.py 正在运行且 MySQL 可访问</div>';
  });
</script>
</body>
</html>
