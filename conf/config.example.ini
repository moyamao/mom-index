[notifications]
dingtalk_enabled = true
# 默认复用 stock_monitor 社媒监控的钉钉机器人，不在本项目保存 webhook/secret。
dingtalk_config_file = ~/python/stock_monitor/conf/social_monitor.json
timeout_seconds = 10

[wechat]
enabled = false
export_dir = private/wechat_exports
groups =
lookback_days = 7
privacy_salt = change-this-local-only-salt

# 唯一关键词词表。所有平台搜索、帖子归类、跨板块去重都读取这里。
# 逗号分隔；配置某个板块会完全覆盖内置词表。修改后下次运行即生效。
[keywords]
nasdaq = 美股怎么买, 纳斯达克新手, 纳指还能买吗, 纳指ETF, 美股定投, 买美股
gold = 黄金怎么买, 买黄金亏了, 黄金新手, 黄金还能涨吗, 黄金ETF, 买黄金
cpo = CPO还能买吗, 光模块还能涨吗, 通信ETF, 算力牛市
semiconductor = 芯片还能买吗, 半导体新手, 半导体ETF, 半导体追高, AI芯片
storage = 存储, 存储芯片, 海力士, SK海力士, HBM, 美光, 三星, 三星存储, 长鑫存储, 兆易创新, 西部数据, 闪迪

# 仅已确认发布时间的近期帖子参与当期分析；时间未知的帖子排除。
[recency]
max_age_days = 7
daily_min_posts = 20

[llm]
enabled = false
# mini-14b 用于 Mac mini 日常分析；macbook-27b 用于 MacBook 按需复核。
profile = mini-14b
prompt_version = sentiment-v3
api_key =
base_url = https://api.openai.com/v1
# 兼容 OpenAI Chat Completions 的服务可填写完整 URL；未填写 https:// 时程序会自动补全。
# 本地 Qwen/llama-server 推荐用 QWEN_BASE_URL 环境变量（优先级更高），
# 例如 http://127.0.0.1:8080 或 http://100.83.225.31:8080，不要包含 /v1。
model = gpt-4.1-mini
mode = all
timeout_seconds = 20
max_chars = 1200
include_reasoning = true
# 先用规则筛选，再按发布时间优先二判；控制成本并避免触发模型限流。
max_posts_per_run = 1000
request_interval_seconds = 0.25

[runtime]
# Mac mini 生产环境设为 collector；MacBook 开发环境设为 analyst。
role = analyst
allow_collection = false

[keyword_admin]
# 网页管理接口启用后必须设置随机 token，避免局域网内任何人修改关键词。
enabled = false
token =

[web]
host = 0.0.0.0
port = 8081
